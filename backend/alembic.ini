# Alembic configuration for the piano lessons backend.
#
# The database URL is deliberately absent: env.py resolves it with
# backend.database.database_url() so the migrations, `make backend` and
# `make test` always point at the same database (PIANO_DATABASE_URL).

[alembic]
script_location = %(here)s/migrations

# The repository root, so `import backend.database` works no matter which
# directory alembic is invoked from.
prepend_sys_path = %(here)s/..

path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
